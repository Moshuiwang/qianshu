[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "qianshu"
version = "0.2.0"
requires-python = "==3.12.*"
dependencies = [
    "anthropic>=0.80,<1",
    "python-dotenv>=1.0,<2",
    "lark-oapi==1.8.0",
    "httpx>=0.28,<1",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
mingdao-check = ["playwright>=1.50,<2"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
required-version = "==0.12.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
