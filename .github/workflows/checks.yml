name: qianshu checks
# 资源约定见 docs/协作约定.md「CI 资源约定」：
# - 只在面向 main 的正式 PR 上跑；不跑 push、定时任务，草稿 PR 不跑
# - 只有一个任务（qianshu-checks），它是 main 的必过检查
# - 只改文档的 PR 几秒内直接通过，不装依赖
# - 同一 PR 有新提交时取消旧的运行；不上传产物
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qianshu-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: qianshu-checks
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Decide check level
        id: level
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/ci-level"
          sh scripts/ci_select.sh "$BASE" "$HEAD" > "$result"
          # Read through EOF so extra lines and embedded NULs cannot disappear.
          if IFS= read -r -d '' level < "$result"; then exit 1; fi
          level=${level%$'\n'}
          case "$level" in
            docs|full) echo "level=$level" >> "$GITHUB_OUTPUT" ;;
            *) echo 'Invalid CI level: expected docs or full' >&2; exit 1 ;;
          esac
      - name: Docs-only change
        if: steps.level.outputs.level == 'docs'
        run: echo "只改了文档，跳过代码检查。"
      - name: Install locked tooling
        if: steps.level.outputs.level == 'full'
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/bootstrap"
          "$RUNNER_TEMP/bootstrap/bin/pip" install uv==0.12.1
          echo "$RUNNER_TEMP/bootstrap/bin" >> "$GITHUB_PATH"
      - name: Install managed Python
        if: steps.level.outputs.level == 'full'
        run: uv python install "$(cat .python-version)"
      - name: Verify project lock
        if: steps.level.outputs.level == 'full'
        run: sh scripts/ci_check_lock.sh
      - name: Print Python version
        if: steps.level.outputs.level == 'full'
        run: uv run --frozen --python "$(cat .python-version)" --managed-python python -VV
      - name: Run tests
        if: steps.level.outputs.level == 'full'
        run: uv run --frozen --python "$(cat .python-version)" --managed-python python -m pytest -q
